      - docs/design/art/SHADER_SPECS.md
    optional:
      - docs/design/art/rendering/materials_gi_glow.md
      - docs/design/art/ART_DIRECTION.md

  factory_bootstrap:
    must_read:
      - docs/ops/workflow/BRANCHING.md
      - docs/ops/agents/CLOUD_SNAPSHOT_LAUNCH.md
    optional:
      - docs/ops/agents/cloud_setup/setup_automations.md
